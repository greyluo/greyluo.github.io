---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="subtitle">{{ page.subtitle }}</p>{% endif %}
    <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
  </header>
  <div class="post-body">
    {{ content }}
  </div>
  {% if page.original_url %}
  <p class="origin">Originally published on <a href="{{ page.original_url }}">X</a>.</p>
  {% endif %}
  <p class="back"><a href="{{ '/' | relative_url }}">← All writing</a></p>
</article>
